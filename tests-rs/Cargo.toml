[package]
name = "fc-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Rust port of the Firecracker python test harness (tests/framework, tests/host_tools, tools/*.py)"
license = "Apache-2.0"

# Standalone workspace: this crate lives inside the Firecracker checkout but is
# deliberately not a member of its cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc = "0.2"
regex = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rand = "0.8"

[[bin]]
name = "fc-sandbox"
path = "src/bin/sandbox.rs"

[[bin]]
name = "fc-release-notes"
path = "src/bin/release_notes.rs"

[[bin]]
name = "fc-gh-release"
path = "src/bin/gh_release.rs"

[[bin]]
name = "fc-test-bindings"
path = "src/bin/test_bindings.rs"

[[bin]]
name = "fc-ab-test"
path = "src/bin/ab_test.rs"

[[bin]]
name = "fc-ab-plot"
path = "src/bin/ab_plot.rs"

[[bin]]
name = "fc-virtiofs-smoke"
path = "src/bin/virtiofs_smoke.rs"

[[bin]]
name = "fc-test-docker-rootfs"
path = "src/bin/test_docker_rootfs.rs"

[[bin]]
name = "fc-pipeline"
path = "src/bin/pipeline.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
